name: Probe Cloudflare (lecture seule)

# Sonde jetable (23/11/2026) : mesure ce que Cloudflare répond à l'IP d'un runner GitHub pour les
# pages de prop firms. AUCUN secret, AUCUN commit, AUCUN déploiement, AUCUN Discord : lecture seule,
# déclenchée uniquement par un push de cette branche. 2e passe : répétition espacée de curl_cffi.
on:
  push:
    branches: [feat/scrapers-curl-cffi]
    paths: ['.github/workflows/probe-cloudflare.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: IP du runner
        continue-on-error: true
        run: curl -sS https://api.ipify.org; echo

      - name: "curl_cffi, 6 essais espacés de 20 s par page"
        continue-on-error: true
        run: |
          pip install curl_cffi
          python3 - <<'EOF'
          import time
          from curl_cffi import requests as cr
          URLS = ['https://lucidtrading.com/', 'https://help.tradeify.co/en/', 'https://support.lucidtrading.com/en/']
          for i in range(6):
              row = []
              for u in URLS:
                  for imp in ('chrome', 'safari'):
                      try:
                          r = cr.get(u, impersonate=imp, timeout=25)
                          row.append(f'{u.split("/")[2]}[{imp}]={r.status_code}{"/challenge" if r.headers.get("cf-mitigated") else ""}')
                      except Exception as e:
                          row.append(f'{u.split("/")[2]}[{imp}]=ERR {type(e).__name__}')
              print(f'essai {i + 1}: ' + '  '.join(row), flush=True)
              time.sleep(20)
          EOF
