name: Probe Cloudflare (lecture seule)

# Sonde jetable (23/11/2026) : lance la vraie lecture Lucid (scrape-lucid.mjs --dry, qui n'écrit rien) depuis un runner
# GitHub, 3 fois à 40 s d'écart. AUCUN secret, AUCUN commit, AUCUN déploiement, AUCUN Discord : lecture seule,
# déclenchée uniquement par un push de cette branche (cible de la lecture : lucidtrading.com, page publique).
on:
  push:
    branches: [feat/scrapers-curl-cffi]
    paths: ['.github/workflows/probe-cloudflare.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: IP du runner
        continue-on-error: true
        run: curl -sS https://api.ipify.org; echo

      - name: pip install curl_cffi
        run: python3 -m pip install curl_cffi

      - name: "scrape-lucid --dry, 3 fois"
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "=== essai $i"
            node scripts/scrape-lucid.mjs --dry || echo "essai $i : code $?"
            sleep 40
          done
