name: Update prop firms data

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Unit tests (parsers must pass before touching public data)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Scrape prop firms prices
        run: node scripts/scrape-prop-firms.mjs

      - name: Build live promos feed
        run: node scripts/build-live-promos.mjs

      # Tradeify (comparateur, compare-extra-firms.json) : code public et 12 prix relus chaque jour
      # (Angelo, 01/11/2026 : « quand c'est expiré check tous les jours jusqu'à ce qu'il y ait le
      # bon code »). Page illisible = firme stale (commitée avec le reste) puis job rouge plus bas.
      - name: Scrape Tradeify (comparator)
        id: tradeify
        continue-on-error: true
        run: node scripts/scrape-tradeify.mjs

      # Les giveaways terminés sur Discord (Angelo, 04/11/2026). Discord illisible = job rouge plus bas.
      - name: Sync giveaways from Discord
        id: giveaways
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/sync-giveaways.mjs

      - name: Check for data changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain public/data/prop-firms.json public/data/live-promos.json public/data/compare-extra-firms.json content/giveaways/giveaways.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push data update
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/prop-firms.json public/data/live-promos.json public/data/compare-extra-firms.json content/giveaways/giveaways.json
          git commit -m "chore(data): daily prop-firms price sync"
          git push origin HEAD:main

      - name: Build Next.js static export
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.diff.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=jacktradesnq --branch=main --commit-dirty=true

      - name: Check rule drift (report only, non-blocking)
        if: always()
        continue-on-error: true
        run: node scripts/check-rule-drift.mjs

      - name: Discord alert — stale firms
        if: always()
        run: |
          STALE=$(python3 -c "import json; fs=[f for p in ('public/data/prop-firms.json', 'public/data/compare-extra-firms.json') for f in json.load(open(p))['firms']]; print(', '.join(f['name'] for f in fs if f.get('stale')))")
          if [ -n "$STALE" ]; then
            curl -sS -H "Content-Type: application/json" -d "{\"content\": \"⚠️ **prop-firms sync** — firmes STALE (site illisible, anciennes données conservées) : $STALE\"}" "${{ secrets.DISCORD_WEBHOOK }}" > /dev/null
          fi

      - name: Discord alert — price changes applied
        if: steps.diff.outputs.changed == 'true'
        run: |
          SUMMARY=$(git show --stat --oneline HEAD | head -3 | tr '\n' ' ' | cut -c1-300)
          curl -sS -H "Content-Type: application/json" -d "{\"content\": \"✅ **prop-firms sync** — prix mis à jour et déployés : $SUMMARY\"}" "${{ secrets.DISCORD_WEBHOOK }}" > /dev/null

      - name: Tradeify unreadable — fail the job
        if: always() && steps.tradeify.outcome == 'failure'
        run: |
          echo "::error::scrape-tradeify : page Tradeify illisible ou moins de 12 prix (voir l'étape « Scrape Tradeify »). Données gardées, stale: true."
          exit 1

      - name: Giveaways unreadable — fail the job
        if: always() && steps.giveaways.outcome == 'failure'
        run: |
          echo "::error::sync-giveaways : Discord illisible (voir l'étape « Sync giveaways from Discord »). Liste gardée telle quelle."
          exit 1

      - name: Discord alert — workflow failed
        if: failure()
        run: |
          curl -sS -H "Content-Type: application/json" -d "{\"content\": \"🔴 **prop-firms sync** — le workflow a ÉCHOUÉ : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" "${{ secrets.DISCORD_WEBHOOK }}" > /dev/null
